# A100 GPU optimized configuration
# Designed for NVIDIA A100 (40GB or 80GB VRAM)
# Balances model size, batch size, and training speed

environment:
  max_steps: 1500
  starting_deck_size: 52

model:
  d_model: 512  # Optimized for A100 - uses more VRAM
  num_heads: 16
  num_layers: 10  # Deep enough for complex strategies
  dropout: 0.1

training:
  total_timesteps: 50_000_000  # 50M timesteps (~8-12 hours on A100)
  learning_rate: 0.0002
  batch_size: 2048  # Large batch size to use A100 capacity
  n_epochs: 10
  n_steps: 4096  # Large rollout buffer
  
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.2
  ent_coef: 0.012
  vf_coef: 0.5
  max_grad_norm: 0.8
  
  normalize_advantage: true
  target_kl: 0.015
  device: "cuda"
  
  # A100-specific optimizations
  use_mixed_precision: true  # A100 has excellent FP16/BF16 support
  compile_model: true  # PyTorch 2.0+ compilation for speedup

logging:
  log_dir: "logs/a100_training"
  log_interval: 10
  save_interval: 100
  use_tensorboard: true

checkpoints:
  dir: "checkpoints/a100"
  save_best: true
  keep_last_n: 8
  save_optimizer: true  # Save optimizer state for resuming

evaluation:
  eval_freq: 500
  n_eval_episodes: 15
  deterministic: true
  
  # Advanced evaluation
  save_eval_videos: false
  eval_on_curriculum: true

curriculum:
  enabled: true
  start_ante: 1
  max_ante: 8
  ante_increase_threshold: 0.75
  
  # Progressive difficulty
  adapt_learning_rate: true
  lr_decay_factor: 0.95

# Performance optimizations
optimization:
  gradient_checkpointing: false  # A100 has enough memory
  pin_memory: true
  num_workers: 8  # More workers for faster data loading
  prefetch_factor: 4  # More prefetching

