# A100 GPU FAST ITERATION configuration
# Optimized for rapid experimentation with new reward structure
# 384d/8layer model with massive batch_size=10240 for quick convergence
# Expected VRAM: ~30-34GB, Training time: ~6-8 hours for 20M steps

environment:
  max_steps: 1500
  starting_deck_size: 52

model:
  d_model: 384  # Fast iteration size - good balance of speed and capacity
  num_heads: 12
  num_layers: 8  # Efficient depth for quick training
  dropout: 0.1

training:
  total_timesteps: 20_000_000
  learning_rate: 0.0002
  batch_size: 20480  # MASSIVE batch for maximum A100 utilization (target ~35GB VRAM)
  n_epochs: 10
  n_steps: 4096  # Large rollout buffer
  
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.2
  ent_coef: 0.012
  vf_coef: 0.5
  max_grad_norm: 0.8
  
  normalize_advantage: true
  target_kl: 0.012
  device: "cuda"
  
  # A100-specific optimizations
  use_mixed_precision: true  # Critical for A100 performance
  compile_model: true  # PyTorch 2.0+ compilation

logging:
  log_dir: "logs/a100_aggressive"
  log_interval: 10
  save_interval: 100
  use_tensorboard: true

checkpoints:
  dir: "checkpoints/a100_aggressive"
  save_best: true
  keep_last_n: 5
  save_optimizer: true

evaluation:
  eval_freq: 500
  n_eval_episodes: 15
  deterministic: true
  save_eval_videos: false
  eval_on_curriculum: true

curriculum:
  enabled: true
  start_ante: 1
  max_ante: 8
  ante_increase_threshold: 0.75
  adapt_learning_rate: true
  lr_decay_factor: 0.95

# Performance optimizations
optimization:
  gradient_checkpointing: false  # A100 has plenty of memory
  pin_memory: true
  num_workers: 8  # More workers for data loading
  prefetch_factor: 4  # More prefetching

