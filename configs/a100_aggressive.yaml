# A100 GPU FULL TRAINING configuration
# Optimized for complete curriculum learning with 50M timesteps
# 384d/8layer model with optimized rollout size for speed
# Expected VRAM: ~8-12GB, Training time: ~12-16 hours for 50M steps

environment:
  max_steps: 1500
  starting_deck_size: 52

model:
  d_model: 384  # Fast iteration size - good balance of speed and capacity
  num_heads: 12
  num_layers: 8  # Efficient depth for quick training
  dropout: 0.1

training:
  total_timesteps: 50_000_000
  learning_rate: 0.0002
  batch_size: 2048  # Mini-batch size for training
  n_epochs: 4  # Reduced for faster training - prevents overfitting
  n_steps: 2048  # Optimal rollout buffer - balance speed and stability
  
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.2
  ent_coef: 0.012
  vf_coef: 0.5
  max_grad_norm: 0.8
  
  normalize_advantage: true
  target_kl: 0.02
  device: "cuda"
  
  # A100-specific optimizations
  use_mixed_precision: true  # Critical for A100 performance
  compile_model: true  # PyTorch 2.0+ compilation

logging:
  log_dir: "logs/a100_aggressive"
  log_interval: 5  # More frequent logging for better monitoring
  save_interval: 100  # Save checkpoints every ~200k steps (~3-5 minutes)
  use_tensorboard: true

checkpoints:
  dir: "checkpoints/a100_aggressive"
  save_best: true
  keep_last_n: 10  # Keep more checkpoints due to frequent saving
  save_optimizer: true

evaluation:
  eval_freq: 500
  n_eval_episodes: 8  # Reduced for faster evaluation cycles
  deterministic: true
  save_eval_videos: false
  eval_on_curriculum: true

curriculum:
  enabled: true
  start_ante: 1
  max_ante: 8
  ante_increase_threshold: 0.75
  adapt_learning_rate: true
  lr_decay_factor: 0.95

# Performance optimizations
optimization:
  gradient_checkpointing: false  # A100 has plenty of memory
  pin_memory: true
  num_workers: 8  # More workers for data loading
  prefetch_factor: 4  # More prefetching

