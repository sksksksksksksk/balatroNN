# Quick test configuration for debugging
# Lower timesteps and smaller model for fast iteration

environment:
  max_steps: 500
  starting_deck_size: 52

model:
  d_model: 128  # Smaller model
  num_heads: 4
  num_layers: 3
  dropout: 0.1

training:
  total_timesteps: 100_000  # 100K for quick testing
  learning_rate: 0.0003
  batch_size: 128  # Smaller batch
  n_epochs: 5
  n_steps: 512  # Fewer steps per rollout
  
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02  # Higher entropy for more exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  normalize_advantage: true
  target_kl: 0.015
  device: "cuda"

logging:
  log_dir: "logs/quick_test"
  log_interval: 5
  save_interval: 20
  use_tensorboard: true
  use_wandb: false

checkpoints:
  dir: "checkpoints/quick_test"
  save_best: true
  keep_last_n: 3

evaluation:
  eval_freq: 200
  n_eval_episodes: 5
  deterministic: true

curriculum:
  enabled: false
  start_ante: 1
  max_ante: 8
  ante_increase_threshold: 0.7

